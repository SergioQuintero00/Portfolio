    <script id="language-detection">
      ;(() => {
        const url = new URL(window.location.href)
        const requestedLanguage = url.searchParams.get('lang')?.toLowerCase()
        const browserLanguage = navigator.languages?.[0] || navigator.language || 'en'
        const language =
          requestedLanguage === 'en' || requestedLanguage === 'es'
            ? requestedLanguage
            : /^es(?:-|$)/i.test(browserLanguage)
              ? 'es'
              : 'en'

        if (language === 'es') {
          url.pathname = '/es/'
          url.searchParams.delete('lang')
          window.location.replace(`${url.pathname}${url.search}${url.hash}`)
        }
      })()
    </script>
    <script>
      ;(() => {
        let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        try {
          const saved = localStorage.getItem('sergio-portfolio-theme')
          if (saved === 'dark' || saved === 'light') theme = saved
        } catch {}
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#101f24' : '#f5f3ee'
      })()
    </script>
